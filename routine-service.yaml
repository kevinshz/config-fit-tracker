server:
  port: 8082

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/routine
    username: ${POSTGRESQL_DB_USERNAME:postgres}
    password: ${POSTGRESQL_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
