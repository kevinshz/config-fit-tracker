server:
  port: 8084

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/workout
    username: ${POSTGRESQL_DB_USERNAME:postgres}
    password: ${POSTGRESQL_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

feign:
  client:
    config:
      default:
        connect-timeout: 5000
        read-timeout: 5000
      calculator-service:
        connect-timeout: 3000
        read-timeout: 3000
      routine-service:
        connect-timeout: 3000
        read-timeout: 3000

fit-tracker:
  progression:
    hypertrophy:
      low: 8
      high: 12
      rir-low: 1
      rir-high: 3
    strength:
      stable-sessions: 2
      rir-min: 1

fittracker:
  rabbitmq:
    exchange: fittracker.exchange
    routing-key: workout.session.completed

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
